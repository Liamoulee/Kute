[package]
name = "kute"
version = "0.1.12"
description = "A high-performance Krunker client with enhanced features"
authors = ["NullDev"]
edition = "2024"

[package.metadata]
js_bundle_version = "0.1.36"

[workspace]
members = ["crates/*"]

# https://doc.rust-lang.org/rustc/codegen-options/index.html
[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# no debug-assertions: the crash log (panic hook, panic location, backtrace) works without them. all the flag did
# was compile debug_assert! and integer overflow checks into our code and every dependency
strip = "symbols"

[features]
packaged = []
auto-update = ["packaged"]
editor-ignore = []
verbose-logs = [
    "obs-kute-capture/verbose-logs",
    "render-dll/verbose-logs",
]

[dependencies]
windows = { version = "0.62.2", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
    "Win32_System_Memory",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Storage_FileSystem",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Media",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Registry",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
] }
cef = { version = "=151.5.0", default-features = false }
ureq = { version = "3.3.*", features = ["rustls"], default-features = false }
serde = { version = "1.0.*", features = ["derive"], default-features = false }
regex = { version = "1.13.*", features = ["std", "perf", "perf-dfa-full", "unicode-perl"], default-features = false }
semver = "1.0.*"
serde_json = "1.0.*"
discord-rich-presence = "1.1.*"
ping-rs = "0.1.*"
dns-lookup = "3.0.*"
obs-kute-capture = { path = "crates/obs-kute-capture", optional = true }
render-dll = { path = "crates/render-dll", optional = true }

[build-dependencies]
embed-resource = "3.0.*"
toml = "1.1.*"
regex = { version = "1.13.*", features = ["std", "perf", "perf-dfa-full", "unicode-perl"], default-features = false }
