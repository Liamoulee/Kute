name: release

on:
  workflow_dispatch:
    inputs:
      # a draft only: the release notes get written by hand before publishing, and the updater
      # only sees a release once it is published
      mode:
        description: What to do with the built installer
        type: choice
        default: draft release
        options:
          - draft release
          - build only
      bump:
        description: Version bump, committed to master once the build passed (ignored for build only)
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
          - none

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          lfs: true

      # only edits the checkout for now, the commit happens after the build
      - name: Bump version
        id: version
        shell: pwsh
        run: |
          $bump = if ("${{ inputs.mode }}" -eq "build only") { "none" } else { "${{ inputs.bump }}" }
          $version = ./.github/scripts/bump-version.ps1 -Bump $bump
          Add-Content $env:GITHUB_OUTPUT "version=$version"
          Add-Content $env:GITHUB_OUTPUT "bumped=$($bump -ne 'none')"

      # fail before the long build when the version was not bumped. an existing draft is fine, it gets updated
      - name: Check that the version is not released yet
        if: inputs.mode != 'build only'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $isDraft = gh release view "${{ steps.version.outputs.version }}" --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0 -and $isDraft -eq "false") {
            throw "Release ${{ steps.version.outputs.version }} is already published. Pick a bump other than none."
          }
          exit 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Ninja
        run: choco install ninja --no-progress -y

      - name: Install WiX 6
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.2
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.dotnet\tools"
          wix extension add -g WixToolset.Util.wixext/6.0.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build installer
        run: bun run package

      # the updater takes the first asset of the release, so the name is free to carry the version
      - name: Name the installer after the version
        id: msi
        shell: pwsh
        run: |
          $path = "target/kute-setup-x86_64-v${{ steps.version.outputs.version }}.msi"
          Move-Item -Force target/kute-setup-x86_64.msi $path
          Add-Content $env:GITHUB_OUTPUT "path=$path"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: kute-setup-x86_64-msi-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: ${{ steps.msi.outputs.path }}
          retention-days: 7

      # created through the API so the commit is signed by GitHub. the build takes a while, so master may have
      # moved: the bump goes on top of the current head as long as the version files are the same there,
      # and expectedHeadOid makes it fail instead of overwriting anything otherwise
      - name: Commit the version bump
        id: commit
        if: inputs.mode != 'build only'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $head = git rev-parse HEAD
          if ("${{ steps.version.outputs.bumped }}" -ne "True") {
            Add-Content $env:GITHUB_OUTPUT "oid=$head"
            exit 0
          }

          $files = "Cargo.toml", "Cargo.lock", "package.json", "resources/installer_script.wxs"

          git fetch --quiet origin master
          $remote = git rev-parse origin/master
          if ($remote -ne $head) {
            git diff --quiet $head $remote -- $files
            if ($LASTEXITCODE -ne 0) {
              throw "master moved during the build and changed the version files, run the workflow again"
            }
            Write-Host "master moved from $head to $remote during the build, the version files are unchanged there"
            $head = $remote
          }

          $additions = @($files | ForEach-Object {
            @{ path = $_; contents = [Convert]::ToBase64String([IO.File]::ReadAllBytes((Resolve-Path $_))) }
          })
          $body = @{
            query = 'mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }'
            variables = @{
              input = @{
                branch = @{ repositoryNameWithOwner = $env:GITHUB_REPOSITORY; branchName = "master" }
                message = @{ headline = "bump version to ${{ steps.version.outputs.version }}" }
                expectedHeadOid = $head
                fileChanges = @{ additions = $additions }
              }
            }
          } | ConvertTo-Json -Depth 10

          $response = $body | gh api graphql --input -
          if ($LASTEXITCODE -ne 0) {
            throw "Could not commit the version bump: $response"
          }
          $oid = ($response | ConvertFrom-Json).data.createCommitOnBranch.commit.oid
          if (-not $oid) {
            throw "Could not commit the version bump: $response"
          }
          Add-Content $env:GITHUB_OUTPUT "oid=$oid"

      - name: Create GitHub Release
        if: inputs.mode != 'build only'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ steps.commit.outputs.oid }}
          name: ${{ steps.version.outputs.version }}
          draft: true
          generate_release_notes: true
          files: ${{ steps.msi.outputs.path }}
