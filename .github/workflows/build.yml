name: build

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    name: Build installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Ninja
        run: choco install ninja --no-progress -y

      - name: Install WiX 6
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.2
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.dotnet\tools"
          wix extension add -g WixToolset.Util.wixext/6.0.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build installer
        run: bun run package

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: kute-setup-x86_64-msi-${{ github.sha }}
          path: target/kute-setup-x86_64.msi
          retention-days: 7
