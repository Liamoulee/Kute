name: deploy server

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Server version bump (server/package.json), committed to master before the deploy
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
          - none

permissions:
  contents: write

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: Production

    if: ${{ !github.event.repository.fork }}

    steps:
      # the server is plain files, the client's libcef.dll in LFS is not needed here
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: master
          lfs: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      # what the server will do on the VPS, done here first: a package.json that disagrees with its lockfile,
      # or code that does not compile, fails before anything is bumped or touched
      - name: Check that the server installs and compiles
        run: |
          (cd server && bun install --frozen-lockfile)
          bun install --frozen-lockfile
          bun run typecheck

      - name: Bump the server version
        id: version
        run: |
          echo "before=$(base64 -w0 server/package.json)" >> "$GITHUB_OUTPUT"
          version=$(node -e '
            const fs = require("fs");
            const file = "server/package.json";
            const text = fs.readFileSync(file, "utf8");
            const current = JSON.parse(text).version;
            let [major, minor, patch] = current.split(".").map(Number);
            const bump = process.argv[1];
            if (bump === "major") { major++; minor = 0; patch = 0; }
            else if (bump === "minor") { minor++; patch = 0; }
            else if (bump === "patch") patch++;
            const next = [major, minor, patch].join(".");
            // only the version line changes, the file keeps its formatting
            if (next !== current) fs.writeFileSync(file, text.replace(`"version": "${current}"`, `"version": "${next}"`));
            console.log(next);
          ' "${{ inputs.bump }}")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # through the API so the commit is signed by GitHub. expectedHeadOid makes it fail instead of
      # overwriting anything when master moved in the meantime
      - name: Commit the version bump
        id: commit
        if: inputs.bump != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          oid=$(jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg head "$(git rev-parse HEAD)" \
            --arg headline "bump server version to ${{ steps.version.outputs.version }}" \
            --arg contents "$(base64 -w0 server/package.json)" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: { input: {
                branch: { repositoryNameWithOwner: $repo, branchName: "master" },
                message: { headline: $headline },
                expectedHeadOid: $head,
                fileChanges: { additions: [{ path: "server/package.json", contents: $contents }] }
              } }
            }' | gh api graphql --input - --jq '.data.createCommitOnBranch.commit.oid')
          echo "$oid"
          echo "oid=$oid" >> "$GITHUB_OUTPUT"

      - name: Pull and restart on the server
        uses: appleboy/ssh-action@334f9259f2f8eb3376d33fa4c684fff373f2c2a6
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.REPO_PATH }}
            GIT_LFS_SKIP_SMUDGE=1 git pull
            bun server/scripts/pull-and-restart.ts ${{ secrets.PM2_HOME }}

      - name: Check that the new version answers
        run: |
          for attempt in 1 2 3 4 5 6; do
            answer=$(curl -fsS --max-time 10 https://kute.lol/api/health || true)
            echo "$answer"
            if echo "$answer" | grep -q "\"version\":\"${{ steps.version.outputs.version }}\""; then exit 0; fi
            sleep 5
          done
          echo "the server does not report version ${{ steps.version.outputs.version }}"
          exit 1

      # a bump without a deploy would leave a version number that never ran anywhere
      - name: Revert the version bump because the deploy failed
        if: failure() && steps.commit.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg head "${{ steps.commit.outputs.oid }}" \
            --arg headline "revert the server version bump, the deploy failed" \
            --arg contents "${{ steps.version.outputs.before }}" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: { input: {
                branch: { repositoryNameWithOwner: $repo, branchName: "master" },
                message: { headline: $headline },
                expectedHeadOid: $head,
                fileChanges: { additions: [{ path: "server/package.json", contents: $contents }] }
              } }
            }' | gh api graphql --input - --jq '.data.createCommitOnBranch.commit.oid'
