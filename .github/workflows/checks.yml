name: checks

on:
  pull_request:

permissions:
  contents: read

# a new push to the same PR makes the running checks pointless
concurrency:
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  js:
    name: Lint, typecheck and bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      # server has its own lockfile, root typecheck needs its deps too
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          (cd server && bun install --frozen-lockfile)

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build the bundle
        run: bun run esbuild

  rust:
    name: Rustfmt and Clippy
    runs-on: windows-latest

    steps:
      # LFS libcef.dll is only for postbuild, clippy doesn't need it
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Rustfmt
        run: cargo fmt --all --check

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # cef-dll-sys builds its wrapper with Ninja
      - name: Install Ninja
        run: choco install ninja --no-progress -y

      - name: Clippy
        run: cargo clippy --workspace --features editor-ignore,verbose-logs -- -D warnings
