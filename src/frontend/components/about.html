<style>
#aboutPopup {
	position: relative;
	box-sizing: border-box;
	width: 460px;
	max-width: 90vw;
	max-height: 90vh;
	overflow-y: auto;
	padding: 2.2em 2.5em 1.8em 2.5em;
	background: #1e1e1e;
	color: #fff;
	border-radius: 14px;
	box-shadow: 0 8px 48px #000c;
	font-family: Consolas, monospace;
	text-align: center;
}

#aboutLogo {
	width: 128px;
	height: 128px;
	display: block;
	margin: 0 auto 0.8em auto;
}

#aboutTitle {
	margin: 0;
	font-size: 2em;
	letter-spacing: 1px;
	color: #35e0e8;
}

#aboutVersion {
	margin: 0.2em 0 1em 0;
	color: #999;
}

#aboutTagline {
	margin: 0 0 1.5em 0;
	line-height: 1.5;
}

#aboutTagline code {
	padding: 0.1em 0.4em;
	border-radius: 4px;
	background: #181818;
	color: #35e0e8;
}

#aboutLinks {
	display: flex;
	gap: 0.8em;
	justify-content: center;
	margin-bottom: 1.6em;
}

.aboutButton {
	flex: 1 1 0;
	padding: 0.7em 0.5em;
	border-radius: 8px;
	background: #2a2a2a;
	color: #fff;
	cursor: pointer;
	user-select: none;
}

.aboutButton:hover {
	background: #333;
	color: #35e0e8;
}

#aboutCreditsTitle {
	margin: 0 0 0.5em 0;
	font-size: 0.85em;
	letter-spacing: 2px;
	color: #999;
}

#aboutCredits {
	margin: 0;
	padding: 0;
	list-style: none;
	font-size: 0.9em;
	line-height: 1.8;
	color: #999;
}

#aboutCredits span {
	color: #4fc3f7;
	cursor: pointer;
}

#aboutCredits span:hover {
	text-decoration: underline;
}

#aboutClose {
	position: absolute;
	top: 0.6em;
	right: 0.9em;
	font-size: 1.4em;
	color: #999;
	cursor: pointer;
}

#aboutClose:hover {
	color: #fff;
}

<div id="aboutPopup">
	<div id="aboutClose">&times;</div>
	<img id="aboutLogo" alt="Kute">

	<div id="aboutVersion"></div>
	<p id="aboutTagline">A high-performance Krunker client with enhanced features - made by <code>[cute]</code></p>

		<div class="aboutButton" data-url="https://github.com/NullDev/Kute/issues/new">Report a problem</div>
	</div>
	<div id="aboutCreditsTitle">CREDITS</div>
	<ul id="aboutCredits">
		<li><span data-url="https://github.com/slavcp/glorp">slavcp/glorp</span> - base</li>
		<li><span data-url="https://github.com/6ct/clientpp">6ct/clientpp</span> - flags</li>
		<li><span data-url="https://github.com/KraXen72/crankshaft">KraXen72/crankshaft</span> - menu timer css</li>
		<li><span data-url="https://github.com/idkr-client/idkr">idkr-client/idkr</span> - tweaks</li>
		<li><span data-url="https://github.com/bigjakk/Electron-Websocket-Fix">bigjakk/Electron-Websocket-Fix</span> - aim-freeze fix</li>
	</ul>
</div>
