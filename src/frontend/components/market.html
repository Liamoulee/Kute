<style>
    :host{all:initial}
    *{box-sizing:border-box}
    .km{width:min(1180px,96vw);height:min(820px,92vh);display:flex;flex-direction:column;background:#17181d;color:#e8e8ec;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.6);font-family:"GameFont","Segoe UI",Arial,sans-serif;font-size:14px;overflow:hidden}
    .kmHead{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#1f2027;border-bottom:1px solid #2b2d36}
    .kmTitle{font-size:18px;font-weight:800;letter-spacing:.5px;margin-right:8px}
    .kmTitle span{color:#f5479b}
    .kmTabs{display:flex;gap:4px;flex:1;flex-wrap:wrap}
    .kmTab{background:transparent;border:0;color:#aab;padding:7px 12px;border-radius:6px;font:inherit;font-weight:700;cursor:pointer}
    .kmTab:hover{background:#2a2c36;color:#fff}
    .kmTab.on{background:#f5479b;color:#fff}
    .kmClose{background:#2a2c36;border:0;color:#fff;width:34px;height:34px;border-radius:6px;font-size:18px;cursor:pointer}
    .kmBody{flex:1;overflow:auto;padding:14px}
    .kmFoot{padding:6px 14px;font-size:12px;color:#889;border-top:1px solid #2b2d36;display:flex;justify-content:space-between}
    .kmRow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
    .kmRow label{color:#aab;font-size:12px}
    input,select,button.kmBtn{font:inherit;background:#23252e;color:#fff;border:1px solid #343743;border-radius:6px;padding:6px 10px}
    input:focus,select:focus{outline:2px solid #f5479b55}
    button.kmBtn{cursor:pointer;font-weight:700}
    button.kmBtn:hover{background:#2e313c}
    button.kmBtn.on{background:#f5479b;border-color:#f5479b}
    table{width:100%;border-collapse:collapse}
    th{text-align:left;color:#889;font-size:12px;font-weight:700;padding:6px 8px;border-bottom:1px solid #2b2d36;white-space:nowrap}
    td{padding:6px 8px;border-bottom:1px solid #22242c;white-space:nowrap}
    tr.kmClick{cursor:pointer}
    tr.kmClick:hover td{background:#22242c}
    td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
    .kmThumb{width:28px;height:28px;object-fit:contain;vertical-align:middle;margin-right:6px;background:#0f1013;border-radius:4px}
    .kmGrade{display:inline-block;min-width:18px;text-align:center;border-radius:4px;padding:1px 5px;color:#111;font-weight:800;font-size:12px}
    .up{color:#5ce05a}.down{color:#f44336}.flat{color:#aab}
    .kmCards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
    .kmCard{background:#1f2027;border:1px solid #2b2d36;border-radius:8px;padding:10px 12px}
    .kmCard .k{color:#889;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
    .kmCard .v{font-size:20px;font-weight:800;margin-top:2px}
    .kmCard .s{font-size:12px;color:#aab;margin-top:2px}
    .kmGrid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    @media (max-width:900px){.kmGrid2{grid-template-columns:1fr}}
    h3{margin:14px 0 8px;font-size:13px;color:#889;text-transform:uppercase;letter-spacing:.6px}
    canvas{width:100%;height:220px;display:block;background:#13141a;border-radius:8px}
    .kmBar{height:8px;background:#2b2d36;border-radius:4px;overflow:hidden;margin:4px 0}
    .kmBar i{display:block;height:100%;background:#f5479b}
    .kmBars{display:flex;align-items:flex-end;gap:3px;height:70px}
    .kmBars i{flex:1;background:#f5479b;border-radius:2px 2px 0 0;min-height:1px}
    .kmMuted{color:#889}
    .kmEmpty{padding:30px;text-align:center;color:#889}
    .kmVerdict{font-size:22px;font-weight:800;margin:6px 0}
    .kmVerdict.good{color:#5ce05a}.kmVerdict.bad{color:#f44336}.kmVerdict.fair{color:#9ccc65}.kmVerdict.uncertain{color:#fbc02d}
    .kmSide{background:#1f2027;border:1px solid #2b2d36;border-radius:8px;padding:10px}
    .kmSide h4{margin:0 0 8px;font-size:13px;color:#aab}
    .kmPick{position:relative}
    .kmPickList{position:absolute;left:0;right:0;top:100%;z-index:5;background:#23252e;border:1px solid #343743;border-radius:6px;max-height:220px;overflow:auto}
    .kmPickList div{padding:6px 10px;cursor:pointer}
    .kmPickList div:hover{background:#2e313c}
    .kmRemove{background:transparent;border:0;color:#f44336;cursor:pointer;font-weight:800}
    .kmLink{color:#f5479b;cursor:pointer;text-decoration:underline}
    .kmBack{margin-bottom:10px}
</style>
<div class="km" id="km">
    <div class="kmHead">
        <div class="kmTitle"><span>Kute</span> Market</div>
        <div class="kmTabs" id="kmTabs">
            <button class="kmTab" data-tab="overview">Overview</button>
            <button class="kmTab" data-tab="search">Search</button>
            <button class="kmTab" data-tab="movers">Movers</button>
            <button class="kmTab" data-tab="deals">Deals</button>
            <button class="kmTab" data-tab="indices">Indices</button>
            <button class="kmTab" data-tab="portfolio">Portfolio</button>
            <button class="kmTab" data-tab="analyze">Trade Analyzer</button>
            <button class="kmTab" data-tab="help">How it works</button>
        </div>
        <button class="kmClose" id="kmClose" title="Close (Esc)">✕</button>
    </div>
    <div class="kmBody" id="kmBody"></div>
    <div class="kmFoot"><span id="kmFootLeft">Values are Kute's own estimate from Krunker's public market data. Analytics only, nothing is bought or sold.</span><span id="kmFootRight"></span></div>
</div>
