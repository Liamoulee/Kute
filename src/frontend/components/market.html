<style>
    :host{all:initial;color-scheme:dark}
    *{box-sizing:border-box}
    .km{--pink:#f580b4;--text:#e9e9ef;--muted:#9899a8;--line:#292b35;display:grid;grid-template-columns:184px minmax(0,1fr);width:min(1320px,96vw);height:min(880px,92vh);background:#15161c;color:var(--text);border:1px solid #36333e;border-radius:16px;box-shadow:0 28px 100px #0009;font:14px/1.5 "Segoe UI",Arial,sans-serif;overflow:hidden;text-align:left}
    button,input,select{font:inherit;color:inherit}
    button{cursor:pointer}
    button:disabled{opacity:.35;cursor:default}
    button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--pink);outline-offset:3px}
    button{border:0;background:none}
    .kmSidebar{display:flex;flex-direction:column;background:#111218;border-right:1px solid var(--line);padding:26px 14px 16px;min-width:0}
    .intelligenceHero{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:28px;padding:25px;border:1px solid #443443;background:linear-gradient(120deg,#29202c,#1b1d26);border-radius:12px;margin-bottom:24px}
    .intelligenceHero h2{font-size:22px;line-height:1.35;max-width:440px}.intelligenceHero .sub{max-width:590px}
    .intelligenceProof{display:flex;flex-direction:column;align-items:flex-start;gap:7px;border-left:1px solid #463746;padding-left:24px;font-size:11px;color:var(--muted)}
    .intelligenceProof strong{font-size:34px;line-height:1.2;font-weight:600}.intelligenceProof small{line-height:1.5}
    .intelligenceFilters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:20px}
    .dealEvidence{display:block;margin-top:8px;max-width:280px;font-size:10px;white-space:normal;font-weight:400}
    .intelligenceGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    .signalCard{display:flex;flex-direction:column;min-width:0;background:#1b1c24;border:1px solid var(--line);border-radius:10px;padding:20px}
    .signalCard .panelHead{margin-bottom:20px}.signalCard .panelHead>button{min-width:0;text-align:left;padding:0}.signalCard h2{font-size:17px}.signalCard .sub{font-size:12px}
    .signalBottom{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:20px;margin-top:auto;font-size:13px}.signalBottom small{display:block;font-size:10px;color:var(--muted)}
    .signalCaution{font-size:11px;color:#e8b69a;margin-top:12px}.signalReason{padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}.signalReason p{color:var(--muted);font-size:12px;margin-top:4px}
    .intelligenceItem{margin-bottom:20px}.outlook{padding-top:20px}.intelligenceDetails{margin-top:24px}.intelligenceDetails summary{cursor:pointer;font-weight:600}.intelligenceDetails .tableWrap{margin-top:18px}
    .coverageRow{display:flex;flex-wrap:wrap;gap:12px 24px;margin-top:18px;font-size:11px;color:var(--muted)}.coverageRow b{color:var(--text)}
    @media(max-width:800px){.intelligenceHero{grid-template-columns:1fr;gap:18px;padding:20px}.intelligenceProof{border-left:0;border-top:1px solid #463746;padding:15px 0 0}.intelligenceGrid{grid-template-columns:1fr}.signalBottom{flex-wrap:wrap}}
    .brand{display:flex;align-items:center;gap:10px;padding:0 10px 35px;font-weight:700;font-size:16px;letter-spacing:-.4px}
    .brandMark{width:32px;height:32px;border-radius:10px;background:#f580b4;color:#25151f;display:grid;place-items:center;font-size:21px;font-weight:900}
    .brand small{display:block;color:#858593;font-size:10px;letter-spacing:2px;font-weight:600;line-height:1.1;margin-top:4px}
    .navCaption{padding:0 12px;color:#727482;font-size:10px;letter-spacing:1.5px;margin-bottom:10px}
    .kmNav{display:flex;flex-direction:column;gap:5px}
    .kmNav button,.helpNav{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;border-radius:8px;color:#999baa;text-align:left;font-size:13px;font-weight:600}
    .kmNav button:hover,.helpNav:hover{background:#20212a;color:#fff}
    .kmNav button.on{background:#f580b412;color:#f6a0c7}
    .navIcon{font:18px/1 "Segoe UI Symbol","Segoe UI",sans-serif;width:20px;text-align:center;font-weight:400}
    .navCount{margin-left:auto;font-size:10px;background:#29232d;padding:1px 6px;border-radius:4px}
    .sidebarBottom{margin-top:auto}
    .sidebarNote{color:#636572;font-size:11px;padding:12px 12px 0;border-top:1px solid #23242c;margin-top:10px}
    .kmMain{display:flex;flex-direction:column;min-width:0;min-height:0}
    .kmHead{display:flex;align-items:center;gap:16px;padding:19px 28px;border-bottom:1px solid var(--line);min-height:76px}
    .kmHeadTitle{font-size:15px;font-weight:600;min-width:80px}
    .globalSearch{margin-left:auto;position:relative;max-width:290px;flex:1}
    .globalSearch input{width:100%;padding:8px 12px 8px 31px;background:#1c1d25;border:1px solid #2c2d38;border-radius:7px;font-size:12px}
    .globalSearch>.searchIcon{position:absolute;left:11px;top:7px;color:#777987}
    .kmHead{position:relative;z-index:10}
    .mode{display:flex;align-items:center;gap:8px;font-size:11px;white-space:nowrap;color:#a5a5b2;cursor:pointer}
    .mode input{appearance:none;width:28px;height:16px;border-radius:20px;background:#383943;position:relative;cursor:pointer;margin:0}
    .mode input:before{content:"";position:absolute;width:10px;height:10px;left:3px;top:3px;border-radius:50%;background:#a7a8b3}
    .mode input:checked{background:#8a3f63}
    .mode input:checked:before{left:15px;background:#ffc4df}
    .kmClose{font-size:20px;line-height:1;color:#7f8190;padding:3px 7px;border-radius:5px}
    .kmClose:hover{background:#30313b;color:#fff}
    .kmBody{flex:1;overflow:auto;padding:28px;scrollbar-color:#373945 transparent;scrollbar-width:thin;min-height:0}
    .kmFoot{border-top:1px solid var(--line);padding:9px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;color:#777988;font-size:10px}
    .statusDot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#7ec9aa;margin-right:6px}
    .pageIntro{display:flex;align-items:flex-start;gap:15px;margin-bottom:24px}
    .pageIntro>div:first-child{flex:1;min-width:0}
    h1,h2,h3,h4,p{margin:0}
    h1{font-size:27px;letter-spacing:-.8px;font-weight:650;line-height:1.25}
    h2{font-size:17px;letter-spacing:-.3px;font-weight:600}
    h3{font-size:14px;font-weight:600}
    p.sub{color:var(--muted);font-size:13px;margin-top:7px;line-height:1.6}
    .eyebrow{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
    .muted{color:var(--muted)}
    .positive{color:#77d9b0}.negative{color:#f390a0}.accent{color:var(--pink)}
    .button{border:1px solid #383a45;border-radius:7px;padding:8px 13px;background:#24252f;font-size:12px;font-weight:600;display:inline-flex;gap:7px;align-items:center;justify-content:center;white-space:nowrap}
    .button:hover{background:#30313c;border-color:#565360}
    .button.primary{background:#f580b4;color:#27151f;border-color:#f580b4}
    .button.primary:hover{background:#ffa4cf}
    .button.small{padding:5px 10px;font-size:11px}
    .textButton{padding:0;font-size:11px;color:var(--pink);font-weight:600}
    .textButton:hover{text-decoration:underline}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .spacer{flex:1}
    .panel{border:1px solid var(--line);border-radius:10px;background:#191a22;padding:20px;min-width:0}
    .panelHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:17px}
    .panelHead small{font-size:11px;color:var(--muted)}
    .split{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(240px,1fr);gap:18px;margin-bottom:20px}
    .equal{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:20px}
    .metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;margin-bottom:20px;background:#191a22}
    .itemMetrics{grid-template-columns:repeat(4,minmax(0,1fr))}
    @media(min-width:761px) and (max-width:1050px){.itemMetrics{grid-template-columns:repeat(2,minmax(0,1fr))}.itemMetrics .metric:nth-child(3){border-left:0}.itemMetrics .metric:nth-child(n+3){border-top:1px solid var(--line)}}
    .metric{padding:18px 20px;min-width:0}
    .metric+.metric{border-left:1px solid var(--line)}
    .metric>span{font-size:11px;color:var(--muted);display:block}
    .metric strong{display:block;font-size:25px;font-weight:600;letter-spacing:-.7px;line-height:1.4;font-variant-numeric:tabular-nums}
    .metric strong .unit{font-size:13px;color:#9698a7;font-weight:400;letter-spacing:0}
    .metric small{display:block;font-size:11px;color:var(--muted);margin-top:4px}
    .breadth{display:flex;height:7px;gap:3px;margin:19px 0 12px;border-radius:7px;overflow:hidden;background:#343541}
    .breadth i{height:100%;min-width:1px}
    .breadthLabels{display:flex;justify-content:space-between;font-size:11px;gap:10px}
    .categoryGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
    .category{border:1px solid #35313c;background:#f580b407;border-radius:8px;text-align:left;padding:15px;min-height:92px}
    .category:hover{border-color:#a35b7e;background:#f580b410}
    .category b{display:block;font-size:12px;margin-bottom:5px}
    .category strong{font-size:19px;font-weight:600;display:block;letter-spacing:-.4px}
    .category small{display:block;font-size:10px;color:var(--muted);margin-top:5px}
    .list{display:flex;flex-direction:column}
    .listRow{display:flex;align-items:center;gap:10px;width:100%;padding:11px 0;border-bottom:1px solid #292a34;text-align:left}
    .listRow:last-child{border:0}
    .listRow:hover .itemIdentity b{color:var(--pink)}
    .itemIdentity{display:inline-flex;align-items:center;gap:11px;min-width:0}
    .itemIdentity img,.itemPlaceholder{width:36px;height:36px;object-fit:contain;background:#24252f;border-radius:7px;flex-shrink:0}
    .itemPlaceholder{display:grid;place-items:center;color:#8e6079;font-weight:700}
    .itemIdentity b{font-size:13px;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;max-width:230px}
    .itemIdentity small{display:block;color:#858797;font-size:11px;margin-top:2px}
    .listValue{margin-left:auto;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-size:13px}
    .listValue small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
    .chart{position:relative;width:100%;min-height:260px}
    .chart svg{display:block;width:100%;font:11px "Segoe UI",sans-serif;fill:#7f8190;overflow:visible}
    .chartTooltip{position:absolute;top:20px;background:#272833f5;border:1px solid #474652;box-shadow:0 6px 20px #0006;border-radius:7px;padding:10px 12px;font-size:11px;line-height:1.7;pointer-events:none;z-index:2;color:#c0c2ce;min-width:150px;max-width:240px}
    .chartTooltip strong{color:#fff}
    .chartEmpty{height:260px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:12px;padding:30px}
    .chartLegend{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:#a4a5b3;margin-bottom:8px}
    .chartLegend i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px}
    .segmented{display:inline-flex;gap:2px;background:#13141a;border:1px solid #2a2c36;border-radius:7px;padding:3px}
    .segmented button{font-size:11px;border-radius:4px;color:#8f91a0;padding:5px 10px}
    .segmented button.on{background:#33303d;color:#ffb9d9}
    .segmented button:hover{color:#fff}
    .chartNote{font-size:11px;color:#9698a7;margin-top:9px;line-height:1.5}
    .filterBar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:18px 0}
    .field{display:flex;flex-direction:column;gap:5px;min-width:0;font-size:11px;color:var(--muted)}
    .field input,.field select,.filterBar input,.filterBar select{background:#1d1e27;border:1px solid #353641;border-radius:6px;padding:8px 10px;color:#dedee7;min-width:0;font-size:12px}
    .filterBar input{max-width:200px}
    .filterBar input[type=number]{width:130px}
    .discoverTabs{display:flex;flex-shrink:0;gap:6px;padding:0 28px;border-bottom:1px solid var(--line);background:#17181f;overflow-x:auto;scrollbar-width:thin}
    .discoverTabs[hidden]{display:none}
    .discoverTabs button{padding:13px 12px 11px;border-bottom:2px solid transparent;white-space:nowrap;color:#999baa;font-size:12px}
    .discoverTabs button:hover{color:#f6c3db;background:#f580b407}
    .discoverTabs button[aria-selected=true]{color:#ffb3d5;border-bottom-color:var(--pink);background:#f580b407}
    .discoverTabs button:focus-visible{outline-offset:-4px}
    @media(max-width:760px){.discoverTabs{padding:0 12px;gap:0}.discoverTabs button{padding:12px 9px 10px;font-size:11px}}
    .tableWrap{overflow:auto;border:1px solid var(--line);border-radius:10px}
    table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
    th{padding:11px 15px;text-align:left;color:#808391;font-weight:500;font-size:11px;background:#191a22;white-space:nowrap;border-bottom:1px solid var(--line)}
    td{padding:12px 15px;border-bottom:1px solid #262832;white-space:nowrap}
    tbody tr:last-child td{border:0}
    tr.clickable{cursor:pointer}
    tr.clickable:hover{background:#20212b}
    .num{text-align:right}
    td small{display:block;color:#838594;font-size:11px;margin-top:3px}
    .tag{display:inline-block;padding:3px 7px;border-radius:5px;background:#2b2935;color:#b6a9c5;font-size:11px;white-space:nowrap}
    .tag.quiet{background:#242631;color:#9699aa}
    .tag.good{background:#77d9b010;color:#77d9b0}
    .tag.warn{background:#d5b67910;color:#d5b679}
    .pagination{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:11px;color:var(--muted)}
    .itemHero{display:flex;align-items:center;gap:20px;margin:18px 0 24px}
    .itemArt{width:90px;height:90px;background:radial-gradient(ellipse,#3c2b3f,#1d1b25 75%);border:1px solid #3e3043;border-radius:16px;display:grid;place-items:center;flex-shrink:0}
    .itemArt img{width:82px;height:82px;object-fit:contain}
    .itemHero h1{font-size:28px;margin-top:5px}
    .itemHero .itemActions{margin-left:auto}
    .insightList{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:14px}
    .insightList li{font-size:13px;color:#afb1c0;line-height:1.65;display:flex;gap:9px}
    .insightList li:before{content:"\2022";color:#f580b4;font-weight:800}
    .rangeTrack{height:5px;background:#32333f;border-radius:5px;margin:14px 0 8px;position:relative}
    .rangeTrack i{position:absolute;top:-3px;width:11px;height:11px;border-radius:50%;background:#f580b4;transform:translateX(-50%);border:2px solid #191a22}
    details{margin-top:18px;border:1px solid var(--line);border-radius:9px;padding:14px 17px;background:#191a22}
    summary{cursor:pointer;font-size:12px;font-weight:600;color:#bbbdcb}
    details p{font-size:13px;color:var(--muted);margin-top:12px;line-height:1.7}
    .empty{padding:42px 20px;text-align:center}
    .emptyMark{display:block;color:#b86d93;font-size:30px;margin-bottom:12px}
    .empty h2{font-size:17px;margin-bottom:9px}
    .empty p{font-size:13px;color:var(--muted);max-width:350px;margin:0 auto 18px;line-height:1.7}
    .notice{border:1px solid #66523d;border-radius:7px;color:#d2ba99;font-size:11px;padding:10px 13px;background:#b98d5310;margin:15px 0;line-height:1.6}
    .tradeBoard{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:18px}
    .tradeSide{display:flex;flex-direction:column;min-width:0;padding:20px;border:1px solid var(--line);border-radius:10px;background:#191a22}
    .tradeSideHead{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .tradeSideHead>span{font-size:11px;color:var(--muted);white-space:nowrap}
    .tradeTotal{margin:14px 0 18px}
    .tradeTotal strong,.tradeDifference strong{display:block;font-size:27px;font-weight:600;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
    .tradeTotal strong small,.tradeDifference strong small{font-size:12px;color:var(--muted);font-weight:400;letter-spacing:0}
    .tradeTotal>span{display:block;color:var(--muted);font-size:11px;min-height:33px}
    .tradeItems{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-content:start;flex:1;min-height:200px;margin:16px 0}
    .tradeItem{position:relative;min-width:0;padding:14px 10px 10px;border:1px solid #333440;border-radius:8px;background:#20212b;text-align:center}
    .tradeItem .itemIdentity{display:flex;flex-direction:column;gap:7px}
    .tradeItem .itemIdentity>span{width:100%;min-width:0}
    .tradeItem .itemIdentity img,.tradeItem .itemPlaceholder{width:72px;height:66px;background:transparent}
    .tradeItem .itemIdentity b{max-width:100%;white-space:nowrap;font-size:12px}
    .tradeItem .itemIdentity small{font-size:10px}
    .tradeItemValue{font-size:13px;font-weight:600;margin:12px 0 10px;font-variant-numeric:tabular-nums}
    .tradeItemValue small{display:block;color:var(--muted);font-size:10px;font-weight:400;margin-top:2px}
    .tradeQuantity{display:flex;align-items:center;justify-content:space-between;gap:6px;border-top:1px solid #333440;padding-top:8px;color:var(--muted);font-size:11px}
    .tradeQuantity input{width:64px;max-width:70%;background:#191a22;border:1px solid #393b45;border-radius:5px;padding:4px 6px;font-size:12px}
    .tradeItem .remove{position:absolute;right:5px;top:4px}
    .tradeEmpty{grid-column:1/-1;min-height:200px;border:1px dashed #363844;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#a7a8b6;font-size:12px;text-align:center;padding:12px}
    .tradeEmpty>span{font-size:25px;color:#796879;margin-bottom:6px}
    .tradeEmpty small{color:#757785;font-size:11px;margin-top:5px}
    .tradeKr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
    .tradeKr input{width:130px;min-width:0;max-width:55%;border:1px solid #383a46;border-radius:6px;background:#13141b;padding:8px 10px;font-size:13px}
    .tradeComparison{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px;border:1px solid var(--line);border-radius:10px;background:#1c1b25;font-size:12px}
    .tradeComparison .verdict{font-size:18px;margin-bottom:4px;line-height:1.4}
    .tradeComparison .eyebrow{margin-bottom:4px}
    .tradeDifference{text-align:right;flex-shrink:0}
    .tradeAdjusted{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
    .tradeAdjusted span{display:block;color:var(--muted);font-size:11px}
    .tradeAdjusted strong{font-size:17px;font-weight:500}
    .remove{color:#8c8e9d;font-size:16px;padding:0 5px}
    .remove:hover{color:#f390a0}
    .itemSearch{position:relative;min-width:0}
    .itemSearch input{width:100%;padding:9px 11px;border:1px solid #363845;background:#20212a;border-radius:6px;font-size:12px}
    .filterBar .itemSearch{flex:1 1 200px;max-width:300px}
    .filterBar .itemSearch input{max-width:none}
    .suggestions{position:absolute;z-index:8;top:calc(100% + 6px);left:0;width:max(100%,300px);max-width:min(390px,75vw);max-height:350px;overflow:auto;background:#23242f;border:1px solid #484450;border-radius:9px;box-shadow:0 14px 32px #0008;scrollbar-width:thin;scrollbar-color:#484450 transparent}
    .globalSearch .suggestions{left:auto;right:0;width:360px}
    .tradeSide:last-child .suggestions{left:auto;right:0}
    .suggestionHeading{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;color:#a9a4b3;font-size:10px;border-bottom:1px solid #343541}
    .suggestionHeading>span{color:#828391}
    .suggestions [role=option]{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;text-align:left}
    .suggestions [role=option]:hover,.suggestions [aria-selected=true]{background:#39313f}
    .suggestions .itemIdentity{flex:1;min-width:0}
    .suggestions .itemIdentity>span{min-width:0}
    .suggestions .itemIdentity b{max-width:none;white-space:nowrap;font-size:12px}
    .suggestions .itemIdentity small{font-size:10px}
    .suggestionValue{font-size:12px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
    .suggestionValue small{display:block;color:var(--muted);font-size:10px}
    .suggestionStatus{padding:16px 12px;font-size:12px;color:var(--muted)}
    .suggestions .searchAll{display:block;width:100%;padding:10px 12px;text-align:left;color:var(--pink);border-top:1px solid #343541;font-size:11px}
    .suggestions .searchAll:hover{background:#39313f}
    @media(max-width:900px){.tradeItems{grid-template-columns:minmax(0,1fr)}.tradeSide{padding:14px}.tradeTotal strong{font-size:23px}.tradeBoard{gap:10px}.tradeSideHead{flex-wrap:wrap}.tradeComparison{flex-wrap:wrap}.tradeDifference{text-align:left}}
    .verdict{font-size:23px;font-weight:600;margin-bottom:10px}
    .allocation{display:flex;gap:4px;height:8px;border-radius:10px;overflow:hidden;margin:15px 0}
