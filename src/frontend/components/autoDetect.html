<style>
#adPanel {
	box-sizing: border-box;
	width: 620px;
	max-width: 90vw;
	max-height: 86vh;
	overflow-x: hidden;
	overflow-y: auto;
	scrollbar-width: thin;
	scrollbar-color: #444 #1e1e1e;
	padding: 2em 2.4em 1.6em 2.4em;
	background: #1e1e1e;
	color: #fff;
	border-radius: 14px;
	box-shadow: 0 8px 48px #000c;
	font-family: Consolas, monospace;
	text-align: center;
}

#adTitle {
	margin: 0 0 0.4em 0;
	font-size: 1.6em;
	letter-spacing: 1px;
	color: #35e0e8;
}

#adStatus {
	min-height: 1.4em;
	margin: 0 0 1.2em 0;
	color: #bbb;
	line-height: 1.5;
}

#adBar {
	height: 6px;
	border-radius: 3px;
	background: #2a2a2a;
	overflow: hidden;
}

#adBarFill {
	width: 0;
	height: 100%;
	background: #35e0e8;
	transition: width 0.3s linear;
}

#adHint {
	margin-top: 1em;
	font-size: 0.8em;
	color: #777;
}

#adActions {
	display: none;
	gap: 0.7em;
	justify-content: center;
	margin-top: 1.4em;
}

.adButton {
	flex: 1 1 0;
	padding: 0.65em 0.5em;
	border-radius: 8px;
	background: #2a2a2a;
	color: #fff;
	cursor: pointer;
	user-select: none;
}

.adButton:hover {
	background: #333;
	color: #35e0e8;
}

#adDetails {
	display: none;
	margin: 1.2em 0 0 0;
	padding: 0;
	list-style: none;
	text-align: left;
	font-size: 0.85em;
	line-height: 1.7;
	color: #bbb;
}

#adDetails b {
	color: #fff;
	font-weight: normal;
}

#adAdvanced {
	display: none;
	margin-top: 1.2em;
	text-align: left;
	font-size: 0.8em;
	color: #bbb;
}

#adAdvanced table {
	width: 100%;
	border-collapse: collapse;
	margin-top: 0.8em;
}

#adAdvanced th,
#adAdvanced td {
	padding: 0.25em 0.4em;
	border-bottom: 1px solid #2c2c2c;
	text-align: left;
}

#adAdvanced th {
	color: #777;
	font-weight: normal;
}

#adAdvanced td.adChanged {
	color: #35e0e8;
}

#adAdvanced p {
	margin: 0.3em 0;
	line-height: 1.5;
}
</style>
<div id="adPanel">
	<h2 id="adTitle">Auto-Detect</h2>
	<div id="adStatus"></div>
	<div id="adBar"><div id="adBarFill"></div></div>
	<div id="adHint">Escape cancels</div>
	<div id="adActions">
		<div class="adButton" id="adUndo">Undo</div>
		<div class="adButton" id="adDetailsButton">Details</div>
		<div class="adButton" id="adAdvancedButton">Advanced</div>
		<div class="adButton" id="adRun">Run now</div>
		<div class="adButton" id="adOk">OK</div>
	</div>
	<ul id="adDetails"></ul>
	<div id="adAdvanced"></div>
</div>
