<style>
#adPanel {
	box-sizing: border-box;
	width: 620px;
	transition: width 0.2s ease;
	max-width: 90vw;
	max-height: 86vh;
	overflow-x: hidden;
	overflow-y: auto;
	scrollbar-width: thin;
	scrollbar-color: #444 #1e1e1e;
	padding: 2em 2.4em 1.6em 2.4em;
	background: #1e1e1e;
	color: #fff;
	border-radius: 14px;
	box-shadow: 0 8px 48px #000c;
	font-family: Consolas, monospace;
	text-align: center;
}

#adTitle {
	margin: 0 0 0.4em 0;
	font-size: 1.6em;
	letter-spacing: 1px;
	color: #35e0e8;
}

#adStatus {
	max-width: 540px;
	min-height: 1.4em;
	margin: 0 auto 1.2em auto;
	color: #bbb;
	line-height: 1.5;
}

#adBar {
	height: 6px;
	border-radius: 3px;
	background: #2a2a2a;
	overflow: hidden;
}

#adBarFill {
	width: 0;
	height: 100%;
	background: #35e0e8;
	transition: width 0.3s linear;
}

#adHint {
	margin-top: 1em;
	font-size: 0.8em;
	color: #777;
}

#adActions {
	display: none;
	max-width: 540px;
	gap: 0.7em;
	justify-content: center;
	margin: 1.4em auto 0 auto;
}

.adButton {
	flex: 1 1 0;
	padding: 0.65em 0.5em;
	border-radius: 8px;
	background: #2a2a2a;
	color: #fff;
	cursor: pointer;
	user-select: none;
}

.adButton:hover {
	background: #333;
	color: #35e0e8;
}

#adDetails {
	display: none;
	max-width: 540px;
	margin: 1.2em auto 0 auto;
	padding: 0;
	list-style: none;
	text-align: left;
	font-size: 0.85em;
	line-height: 1.7;
	color: #bbb;
}

#adDetails b {
	color: #fff;
	font-weight: normal;
}

#adPanel.adWide {
	width: 1300px;
	max-width: 94vw;
	max-height: 92vh;
}

#adAdvanced {
	display: none;
	margin-top: 1.6em;
	text-align: left;
	font-size: 0.85em;
	color: #bbb;
}

.adGrid {
	display: grid;
	grid-template-columns: repeat(auto-fit, minmax(440px, 1fr));
	gap: 14px;
}

.adCard {
	min-width: 0;
	padding: 1.1em 1.3em;
	border-radius: 10px;
	background: #252525;
}

.adCard.adSpan {
	grid-column: 1 / -1;
}

.adCard > :last-child {
	margin-bottom: 0;
}

#adAdvanced h3 {
	margin: 0 0 0.6em 0;
	font-size: 0.85em;
	font-weight: normal;
	letter-spacing: 2px;
	text-transform: uppercase;
	color: #35e0e8;
}

#adAdvanced .adUnit {
	float: right;
	letter-spacing: 0;
	text-transform: none;
	color: #666;
}

#adAdvanced h4 {
	margin: 1.2em 0 0.4em 0;
	font-size: 1em;
	font-weight: normal;
	color: #888;
}

#adAdvanced p {
	max-width: 110ch;
	margin: 0.5em 0;
	line-height: 1.6;
}

#adAdvanced b {
	color: #fff;
	font-weight: normal;
}

#adAdvanced .adNote {
	color: #808080;
	font-size: 0.92em;
}

#adAdvanced .adWarn {
	max-width: none;
	padding: 0.5em 0.8em;
	border-left: 3px solid #f0b040;
	border-radius: 0 6px 6px 0;
	background: #2a2416;
	color: #f3d08a;
}

.adScroll {
	overflow-x: auto;
	scrollbar-width: thin;
	scrollbar-color: #444 #1e1e1e;
}

#adAdvanced table {
	width: 100%;
	border-collapse: collapse;
	margin: 0.4em 0;
	font-variant-numeric: tabular-nums;
}

#adAdvanced th,
#adAdvanced td {
	padding: 0.4em 0 0.4em 1em;
	border-bottom: 1px solid #303030;
	text-align: left;
	vertical-align: top;
}

#adAdvanced th {
	color: #777;
	font-size: 0.92em;
	font-weight: normal;
	vertical-align: bottom;
}

#adAdvanced th:first-child,
#adAdvanced td:first-child {
	padding-left: 0;
}

#adAdvanced tr:last-child td {
	border-bottom: none;
}

#adAdvanced tr:hover td {
	background: #2c2c2c;
}

#adAdvanced td:first-child {
	color: #ddd;
	white-space: nowrap;
}

#adAdvanced table.adWrap td:first-child {
	white-space: normal;
}

#adAdvanced table.adNum td:first-child::first-letter {
	text-transform: uppercase;
}

#adAdvanced table.adNum th:not(:first-child),
#adAdvanced table.adNum td:not(:first-child) {
	text-align: right;
}

#adAdvanced table.adNum td:not(:first-child) {
	white-space: nowrap;
}

#adAdvanced table.adNum th.adResult,
#adAdvanced table.adNum td.adResult {
	padding-left: 1.6em;
	text-align: left;
}

#adAdvanced .adGood {
	color: #35e0e8;
}

#adAdvanced .adBad {
	color: #ff7a7a;
}

#adAdvanced .adMine {
	color: #fff;
}

#adAdvanced .adWas {
	color: #777;
}

.adFooter {
	display: flex;
	gap: 1.6em;
	align-items: center;
	margin-top: 1.2em;
}

.adFooter p {
	flex: 1;
	margin: 0;
}

.adFooter .adButton {
	flex: 0 0 auto;
	padding: 0.65em 1.4em;
}
</style>
<div id="adPanel">
	<h2 id="adTitle">Auto-Detect</h2>
	<div id="adStatus"></div>
	<div id="adBar"><div id="adBarFill"></div></div>
	<div id="adHint">Escape cancels</div>
	<div id="adActions">
		<div class="adButton" id="adUndo">Undo</div>
		<div class="adButton" id="adDetailsButton">Details</div>
		<div class="adButton" id="adAdvancedButton">Advanced</div>
		<div class="adButton" id="adRun">Run now</div>
		<div class="adButton" id="adRestart" style="display: none">Restart now</div>
		<div class="adButton" id="adOk">OK</div>
	</div>
	<ul id="adDetails"></ul>
	<div id="adAdvanced"></div>
</div>
