server {
    listen 80;
    listen [::]:80;

    more_set_headers "Server: NullDev OS";
    server_tokens off;

    server_name kute.lol www.kute.lol;
    error_log /var/www/kute.lol/log/err.log;
    return 301 https://kute.lol$request_uri;
}

server {
    listen [::]:443 ssl http2;
    listen 443 ssl http2;

    server_name kute.lol www.kute.lol;

    ssl_certificate /etc/letsencrypt/live/kute.lol/fullchain.pem;   # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/kute.lol/privkey.pem; # managed by Certbot

    include /etc/nginx/snippets/nulldev-ssl.conf;
    include /etc/nginx/snippets/nulldev-headers.conf;

    error_log /var/www/kute.lol/log/err.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_comp_level 5;
    gzip_types application/json text/css application/x-javascript application/javascript image/svg+xml;
    gzip_proxied any;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header 'Access-Control-Allow-Origin' '';

        proxy_redirect off;
        proxy_pass http://127.0.0.1:3030/;
    }

    location /api/ws {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # the server pings every 25 s
        proxy_read_timeout 120s;
        access_log off;
        proxy_pass http://127.0.0.1:3030;
    }

    location = /dc {
        return 302 https://discord.com/invite/MUJbP3fXrS;
    }

    location ~ /\.ht {
        access_log off;
        log_not_found off;
        deny all;
    }

    location ~ /\.well-known {
        default_type text/plain;
    }
}
